<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="440" viewBox="0 0 1200 440" role="img" aria-labelledby="title description">
  <title id="title">From a click to a page update</title>
  <desc id="description">A four-step diagram showing a user click triggering JavaScript, which updates the page.</desc>
  <defs>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#17251e"/>
      <stop offset="1" stop-color="#304536"/>
    </linearGradient>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M1 1 11 6 1 11" fill="none" stroke="#9ab99a" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"/>
    </marker>
  </defs>
  <rect width="1200" height="440" rx="24" fill="#f1f0e8"/>
  <text x="600" y="66" fill="#26342b" font-family="Arial,sans-serif" font-size="25" font-weight="700" text-anchor="middle">A small interaction, step by step</text>
  <g transform="translate(60 124)">
    <rect width="230" height="196" rx="18" fill="#fffdf7" stroke="#d8d9cf" stroke-width="2"/>
    <rect x="24" y="28" width="182" height="26" rx="6" fill="#ecebe3"/>
    <circle cx="39" cy="41" r="4" fill="#89ad8c"/>
    <rect x="44" y="87" width="144" height="58" rx="12" fill="#27382e"/>
    <text x="116" y="122" fill="#f4f3e9" font-family="Arial,sans-serif" font-size="17" font-weight="700" text-anchor="middle">Click button</text>
    <text x="115" y="174" fill="#647168" font-family="Arial,sans-serif" font-size="15" text-anchor="middle">User action</text>
  </g>
  <path d="M305 220h65" stroke="#829b83" stroke-width="3" marker-end="url(#arrow)"/>
  <g transform="translate(385 124)">
    <rect width="230" height="196" rx="18" fill="url(#panel)"/>
    <text x="115" y="82" fill="#b7d885" font-family="Consolas,monospace" font-size="18" text-anchor="middle">addEventListener</text>
    <text x="115" y="119" fill="#f2f0e5" font-family="Consolas,monospace" font-size="20" text-anchor="middle">("click", ...)</text>
    <text x="115" y="174" fill="#c2d0c0" font-family="Arial,sans-serif" font-size="15" text-anchor="middle">JavaScript listens</text>
  </g>
  <path d="M630 220h65" stroke="#829b83" stroke-width="3" marker-end="url(#arrow)"/>
  <g transform="translate(715 124)">
    <rect width="230" height="196" rx="18" fill="#fffdf7" stroke="#d8d9cf" stroke-width="2"/>
    <rect x="27" y="34" width="176" height="124" rx="8" fill="#e8eee6"/>
    <path d="M27 59h176" stroke="#cdd8ce" stroke-width="2"/>
    <circle cx="43" cy="47" r="4" fill="#829b83"/>
    <path d="m75 105 13 13 28-33" fill="none" stroke="#5d9167" stroke-linecap="round" stroke-linejoin="round" stroke-width="7"/>
    <text x="143" y="113" fill="#344438" font-family="Arial,sans-serif" font-size="15" text-anchor="middle">Update text</text>
    <text x="115" y="181" fill="#647168" font-family="Arial,sans-serif" font-size="15" text-anchor="middle">DOM changes</text>
  </g>
  <path d="M960 220h65" stroke="#829b83" stroke-width="3" marker-end="url(#arrow)"/>
  <g transform="translate(1045 124)">
    <rect width="110" height="196" rx="18" fill="#dce8d6"/>
    <circle cx="55" cy="81" r="29" fill="#82aa82"/>
    <path d="m42 81 9 9 18-21" fill="none" stroke="#fffdf7" stroke-linecap="round" stroke-linejoin="round" stroke-width="5"/>
    <text x="55" y="140" fill="#26392c" font-family="Arial,sans-serif" font-size="15" font-weight="700" text-anchor="middle">Page</text>
    <text x="55" y="161" fill="#26392c" font-family="Arial,sans-serif" font-size="15" font-weight="700" text-anchor="middle">responds</text>
  </g>
</svg>
