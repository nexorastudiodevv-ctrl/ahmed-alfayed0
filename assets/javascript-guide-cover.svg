<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title description">
  <title id="title">JavaScript beginner guide</title>
  <desc id="description">A JavaScript code editor illustration with a bright JS badge.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#101c19"/>
      <stop offset="1" stop-color="#263c32"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#9ed49b"/>
      <stop offset="1" stop-color="#50a96b"/>
    </linearGradient>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M36 0H0V36" fill="none" stroke="#d7f0dd" stroke-opacity=".055"/>
    </pattern>
  </defs>
  <rect width="1200" height="630" rx="28" fill="url(#background)"/>
  <rect width="1200" height="630" rx="28" fill="url(#grid)"/>
  <circle cx="956" cy="170" r="220" fill="#6fc483" opacity=".09"/>
  <circle cx="185" cy="548" r="175" fill="#bbcf78" opacity=".08"/>
  <g transform="translate(85 100)">
