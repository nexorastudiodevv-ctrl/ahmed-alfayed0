    <circle cx="65" cy="32" r="8" fill="#e8bf66"/>
    <circle cx="95" cy="32" r="8" fill="#79bd83"/>
    <rect x="498" y="20" width="94" height="24" rx="12" fill="#26372e"/>
    <text x="545" y="37" fill="#c6d6c9" font-family="Arial,sans-serif" font-size="12" text-anchor="middle">script.js</text>
    <g font-family="Consolas,monospace" font-size="21">
      <text x="40" y="112" fill="#80958a">01</text>
      <text x="80" y="112" fill="#b7d885">const</text>
      <text x="154" y="112" fill="#e6eee8"> button =</text>
      <text x="264" y="112" fill="#8bd0a0">document</text>
      <text x="359" y="112" fill="#e6eee8">.</text>
      <text x="40" y="154" fill="#80958a">02</text>
      <text x="80" y="154" fill="#e6eee8">  querySelector(</text>
      <text x="256" y="154" fill="#e5c27b">'#start'</text>
      <text x="349" y="154" fill="#e6eee8">);</text>
      <text x="40" y="211" fill="#80958a">03</text>
      <text x="80" y="211" fill="#b7d885">button</text>
      <text x="157" y="211" fill="#e6eee8">.</text>
      <text x="171" y="211" fill="#8bd0a0">addEventListener</text>
      <text x="350" y="211" fill="#e6eee8">(</text>
      <text x="40" y="253" fill="#80958a">04</text>
      <text x="80" y="253" fill="#e5c27b">'click'</text>
      <text x="160" y="253" fill="#e6eee8">, () =&gt; {</text>
      <text x="40" y="295" fill="#80958a">05</text>
      <text x="106" y="295" fill="#8bd0a0">showMessage</text>
      <text x="226" y="295" fill="#e6eee8">();</text>
      <text x="40" y="337" fill="#80958a">06</text>
      <text x="80" y="337" fill="#e6eee8">});</text>
    </g>
    <rect x="76" y="370" width="210" height="30" rx="15" fill="#22352a"/>
    <circle cx="95" cy="385" r="5" fill="#8ed196"/>
    <text x="109" y="390" fill="#bfd4c2" font-family="Arial,sans-serif" font-size="13">interactive web pages</text>
  </g>
  <g transform="translate(805 145)">
